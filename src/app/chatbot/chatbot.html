<div class="chat-widget" [class.open]="isOpen()">

  <!-- Floating Toggle Button (hidden when panel is open) -->
  @if (!isOpen()) {
    <button
      id="chat-toggle-btn"
      class="chat-toggle"
      (click)="toggleChat()"
      [attr.aria-expanded]="isOpen()"
      aria-label="Toggle voucher assistant chat"
    >
      <!-- Speech bubble with dots icon -->
      <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
        <circle cx="9"  cy="11" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="11" r="0.8" fill="currentColor" stroke="none"/>
        <circle cx="15" cy="11" r="0.8" fill="currentColor" stroke="none"/>
      </svg>
      <span class="chat-toggle-label">Chat</span>
    </button>
  }

  <!-- Chat Panel -->
  @if (isOpen()) {
    <div class="chat-panel" role="dialog" aria-label="Voucher Assistant Chat">

      <!-- Header -->
      <div class="chat-header">
        <div class="chat-header-avatar">
          <img src="HollywoodLogo.png" alt="Hollywood Logo" class="chat-header-logo" />
        </div>
        <div class="chat-header-info">
          <span class="chat-header-title">Voucher Assistant</span>
          <span class="chat-header-status">
            <span class="status-dot"></span>Online
          </span>
        </div>

        <!-- Language Selector -->
        <div class="chat-lang-selector">
          <select 
            [ngModel]="selectedLanguage()" 
            (ngModelChange)="changeLanguage($event)"
            class="lang-select"
            aria-label="Select language"
          >
            @for (lang of languages; track lang.code) {
              <option [value]="lang.code">{{ lang.flag }} {{ lang.name }}</option>
            }
          </select>
        </div>

        <button class="chat-close-btn" (click)="toggleChat()" aria-label="Close chat">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"/>
            <line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <!-- Messages -->
      <div class="chat-messages" #messagesContainer id="chat-messages-container">
        @for (msg of messages(); track msg.timestamp) {
          <div class="message" [class.user-message]="msg.role === 'user'" [class.assistant-message]="msg.role === 'assistant'">
            @if (msg.role === 'assistant') {
              <div class="message-avatar">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                </svg>
              </div>
            }
            <div class="message-bubble">
              <p class="message-text">{{ msg.text }}</p>
              <span class="message-time">{{ msg.timestamp | date:'shortTime' }}</span>
            </div>
          </div>
        }

        @if (isLoading()) {
          <div class="message assistant-message">
            <div class="message-avatar">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 15l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
              </svg>
            </div>
            <div class="message-bubble typing-bubble">
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
              <span class="typing-dot"></span>
            </div>
          </div>
        }
      </div>

      <!-- Input -->
      <div class="chat-input-area">
        <div class="chat-input-wrapper">
          <textarea
            id="chat-input"
            class="chat-input"
            [value]="userInput()"
            (input)="userInput.set($any($event.target).value)"
            (keydown)="onKeyDown($event)"
            placeholder="Ask about vouchers..."
            rows="1"
            [disabled]="isLoading()"
            aria-label="Type your message"
          ></textarea>
          <button
            id="chat-send-btn"
            class="chat-send-btn"
            (click)="sendMessage()"
            [disabled]="!userInput().trim() || isLoading()"
            aria-label="Send message"
          >
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="22" y1="2" x2="11" y2="13"/>
              <polygon points="22 2 15 22 11 13 2 9 22 2"/>
            </svg>
          </button>
        </div>
        <p class="chat-hint">Press Enter to send · Shift+Enter for new line</p>
      </div>

    </div>
  }

</div>
